# Spring-related configuration
spring.profiles.active=@spring.profiles.active@
application-version=@project.version@
spring.http.codecs.max-in-memory-size=50MB
spring.jackson.mapper.ACCEPT_CASE_INSENSITIVE_ENUMS=true
spring.jackson.default-property-inclusion=non_null
spring.jackson.visibility.creator=any
server.compression.enabled=true
# Logging configuration
logging.pattern.level=:%X{RequestId}:%X{ResultId}: %5p
# MongoDB database configuration
# Spring Boot 4 moved the connection settings from spring.data.mongodb.* to spring.mongodb.*.
# The old keys are deprecated and silently ignored, which leaves the driver on localhost:27017.
spring.mongodb.authentication-database=admin
spring.mongodb.username=rnapdbee
spring.mongodb.password=Xdy0s3XvTLBxACdJrAfb
spring.mongodb.database=backend-db
spring.mongodb.port=27017
spring.mongodb.host=localhost
spring.mongodb.representation.uuid=standard
spring.data.mongodb.gridfs.bucket=analyzedFile
# Configuration related to rnapdbee-engine service
rnapdbee.engine.global.host=http://localhost:8081/calculation-api/
rnapdbee.engine.global.2d.path=v1/2d
rnapdbee.engine.global.3d.path=v1/3d
rnapdbee.engine.global.multi.path=v1/multi
rnapdbee.engine.response.timeout.seconds=1200
# Configuration related to Protein Data Bank
pdb.provider.global.host=https://files.rcsb.org/download/
# Global variables
document.storage.days=14
svg.images.directory.path=/images
# Means 21 seconds of 21:37 on every day
expired.results.cleaner.cron=21 37 21 * * *
# URL of the SVG to PDF conversion service
svg-to-pdf.service.url=${CLI2REST_INKSCAPE_URL:http://localhost:8080/convert}
